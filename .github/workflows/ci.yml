name: CI

on:
  push:
    branches: [main, 'ai/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tests (unit + integration + E2E flows)
        run: npm test
        env:
          JWT_SECRET: ci_test_secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (files developed by the students)
        run: npm run lint:own
      - name: Build
        run: npm run build

  e2e:
    # Browser test of Ram's end-to-end flow against the real stack (MongoDB + backend + built frontend).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      DATABASE: mongodb://127.0.0.1:27017/fluxcrm
      JWT_SECRET: ci_e2e_secret
      NODE_ENV: development
      PUBLIC_SERVER_FILE: http://localhost:8888/
      LOGIN_RATE_LIMIT: '500'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Demo data
        working-directory: backend
        run: node src/setup/ensureDemo.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_BACKEND_SERVER: http://localhost:8888/
      - name: Start servers
        run: |
          (cd backend && nohup node src/server.js > ../backend.log 2>&1 &)
          nohup node scripts/serve-dist.js 3000 > frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && curl -s http://localhost:8888/api/login >/dev/null && break; sleep 2; done
      - name: Browser E2E
        working-directory: e2e
        run: npx playwright test
